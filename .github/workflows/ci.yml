name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Fail if the committed dist/ bundle is out of sync with src/ — a runner
      # executes dist/index.js directly, so it must always be rebuilt + committed.
      - name: Verify dist/ is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit the result"
            git --no-pager diff --stat -- dist/
            exit 1
          fi
