version: 2
updates:
  # The workflows' own actions (checkout / setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Runtime deps are bundled into the committed dist/, so a dependency bump is
  # NOT complete until `npm run build` is re-run and dist/ re-committed — CI's
  # check-dist step will fail on these PRs until someone does that. Grouped into
  # a single PR so that rebuild is one manual step, not one per dependency.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      dependencies:
        patterns: ['*']
